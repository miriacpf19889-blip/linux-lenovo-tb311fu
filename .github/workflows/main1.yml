name: Build rootfs and kernel common

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate rootfs
        run: |
          python3 scripts/stage-rootfs.py \
            --user alarm --uid 1000 --gid 1000 \
            --output build/rootfs
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: build/rootfs

  kernel-common:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Android kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex git libssl-dev \
            python3 clang lld gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Clone Android common kernel
        run: |
          git clone --depth 1 --branch android15-6.6.142_r00 \
            https://android.googlesource.com/kernel/common \
            "$RUNNER_TEMP/kernel-common"

      - name: Apply repo patch
        run: |
          git -C "$RUNNER_TEMP/kernel-common" apply "$GITHUB_WORKSPACE/kernel/patches/0001-host-openssl.patch"

      - name: Build kernel
        env:
          KERNEL_SRC: ${{ runner.temp }}/kernel-common
          KERNEL_OUT: ${{ runner.temp }}/kernel-out
          CLANG_BIN: /usr/lib/llvm/$(ls /usr/lib/llvm | sort | tail -n 1)/bin
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=github-actions
          export KCFLAGS="${KCFLAGS:-} -D__ANDROID_COMMON_KERNEL__"

          mkdir -p "$KERNEL_OUT"
          cp "$GITHUB_WORKSPACE/kernel/configs/tb311fu_defconfig" "$KERNEL_OUT/.config"

          make -C "$KERNEL_SRC" O="$KERNEL_OUT" olddefconfig
          make -C "$KERNEL_SRC" O="$KERNEL_OUT" -j"$(nproc)" Image modules

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-common
          path: ${{ runner.temp }}/kernel-out
