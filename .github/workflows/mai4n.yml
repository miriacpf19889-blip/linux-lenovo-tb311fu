name: Build Android Common Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      KERNEL_REPO: your-org-or-user/tb311fu-kernel
      KERNEL_REF: android15-6.6.142_r00
      KERNEL_SRC: ${{ github.workspace }}/kernel-common
      KERNEL_OUT: ${{ github.workspace }}/build/kernel
      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            git wget curl ca-certificates python3 python3-pip \
            clang lld llvm

      - name: Checkout Android Common kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_REF }}
          path: kernel-common
          token: ${{ secrets.KERNEL_REPO_TOKEN }} # only if private

      - name: Verify required files
        shell: bash
        run: |
          test -f "$KERNEL_SRC/Makefile"
          test -f "$GITHUB_WORKSPACE/kernel/configs/tb311fu_defconfig"
          test -f "$GITHUB_WORKSPACE/kernel/abi/abi_symbollist.raw"

      - name: Build kernel
        shell: bash
        run: |
          export PATH="/usr/lib/llvm-18/bin:/usr/lib/llvm-17/bin:${PATH}"
          export KCONFIG_OVERWRITECONFIG=1
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=localhost
          export KCFLAGS="${KCFLAGS:-} -D__ANDROID_COMMON_KERNEL__"

          mkdir -p "$KERNEL_OUT"

          if [[ ! -f "$KERNEL_OUT/.config" ]]; then
            cp "$GITHUB_WORKSPACE/kernel/configs/tb311fu_defconfig" "$KERNEL_OUT/.config"
          fi

          cp "$GITHUB_WORKSPACE/kernel/abi/abi_symbollist.raw" "$KERNEL_OUT/abi_symbollist.raw"

          make -C "$KERNEL_SRC" O="$KERNEL_OUT" olddefconfig
          make -C "$KERNEL_SRC" O="$KERNEL_OUT" -j"$(nproc)" Image modules

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            build/kernel
            !build/kernel/.config
