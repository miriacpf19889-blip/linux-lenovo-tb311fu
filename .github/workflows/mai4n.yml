name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ROOT: ${{ github.workspace }}
      JOBS: 4
      KERNEL_SRC: ${{ github.workspace }}/kernel
      KERNEL_OUT: ${{ github.workspace }}/build/kernel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev wget curl git \
            python3 python3-pip ca-certificates
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get install -y clang lld llvm
          fi

      - name: Validate kernel source tree
        shell: bash
        run: |
          test -d "$KERNEL_SRC"
          test -f "$KERNEL_SRC/Makefile"
          test -f "$ROOT/kernel/configs/tb311fu_defconfig"
          test -f "$ROOT/kernel/abi/abi_symbollist.raw"

      - name: Build kernel
        shell: bash
        run: |
          export PATH="/usr/lib/llvm-18/bin:/usr/lib/llvm-17/bin:${PATH}"
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          export KCONFIG_OVERWRITECONFIG=1 KBUILD_BUILD_USER=builder KBUILD_BUILD_HOST=localhost
          export KCFLAGS="${KCFLAGS:-} -D__ANDROID_COMMON_KERNEL__"

          mkdir -p "$KERNEL_OUT"

          if [[ ! -f "$KERNEL_OUT/.config" ]]; then
            cp "$ROOT/kernel/configs/tb311fu_defconfig" "$KERNEL_OUT/.config"
          fi

          cp "$ROOT/kernel/abi/abi_symbollist.raw" "$KERNEL_OUT/abi_symbollist.raw"

          make -C "$KERNEL_SRC" O="$KERNEL_OUT" olddefconfig
          make -C "$KERNEL_SRC" O="$KERNEL_OUT" -j"${JOBS:-$(nproc)}" Image modules

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            build/kernel
            !build/kernel/.config
